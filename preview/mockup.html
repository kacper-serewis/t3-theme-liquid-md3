<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid MD3 preview</title>
<!--
  A mockup of T3 Code with the Liquid MD3 theme, used for the README images.
  Colors are copied from ../theme/liquid-md3.json; update them here when the theme changes.
-->
<style>
  * { box-sizing: border-box; }
  html { margin: 0; padding: 0; }
  body { margin: 0; padding: 24px; background: #8a8a86; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; display: grid; gap: 24px; justify-content: center; }

  .win {
    --bg: url(../theme/liquid-md3.webp); --base: #f1ead6;
    --veil: rgb(252 251 247 / .42); --side: rgb(252 251 247 / .16);
    --tint: 255 248 242; --a: .10; --a2: .07;
    --rim: rgb(255 255 255 / .85); --rim2: rgb(255 255 255 / .18); --edge: rgb(255 255 255 / .55); --drop: rgb(55 47 34 / .18);
    --icon: rgb(40 36 30 / .78);
    --text: #1F1B14; --muted: #4E4637; --placeholder: #807665; --border: #D1C5B1;
    --accent: #465D91; --on-accent: #FFFFFF; --accent-rgb: 70 93 145;
    --tonal: #F1E0C5; --on-tonal: #504531;
    --panel: #FFFCF7; --error: #C4001A; --add: #2E7D32;
    width: 1280px; height: 720px; border-radius: 12px; overflow: hidden; position: relative; color: var(--text);
    background: linear-gradient(var(--veil), var(--veil)), var(--bg) 50% 42% / 108% auto no-repeat, var(--base);
    box-shadow: 0 30px 60px -20px rgb(0 0 0 / .45), 0 0 0 1px rgb(0 0 0 / .15);
    display: grid; grid-template-columns: 256px 1fr;
  }
  .win.dark {
    --bg: url(../theme/zonsopgang-monet.avif); --base: #373a37;
    --veil: rgb(24 26 26 / .5); --side: rgb(20 22 22 / .2);
    --tint: 29 32 30; --a: .16; --a2: .06;
    --rim: rgb(255 255 255 / .3); --rim2: rgb(255 255 255 / .06); --edge: rgb(255 255 255 / .2); --drop: rgb(0 0 0 / .35);
    --icon: rgb(240 236 228 / .82);
    --text: #E1E3DE; --muted: #C0C9C0; --placeholder: #8A938B; --border: #404942;
    --accent: #92D5AB; --on-accent: #003920; --accent-rgb: 146 213 171;
    --tonal: #374B3E; --on-tonal: #D1E8D6;
    --panel: #282B28; --error: #FF6961; --add: #7BD88F;
  }

  .glass {
    background: radial-gradient(120% 80% at 15% 0%, rgb(255 255 255 / calc(var(--a2) * 1.6)), transparent 55%),
                linear-gradient(160deg, rgb(var(--tint) / calc(var(--a) + var(--a2))), rgb(var(--tint) / var(--a)));
    backdrop-filter: blur(4px) saturate(1.9) brightness(1.06);
    border: 1px solid var(--edge);
    box-shadow: inset 0 1px 0 var(--rim), inset 0 -1px 0 var(--rim2), 0 10px 30px -12px var(--drop);
  }
  svg { width: 16px; height: 16px; fill: none; stroke: var(--icon); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Sidebar */
  .side { background: var(--side); border-right: 1px solid var(--edge); display: flex; flex-direction: column; padding: 12px 10px; gap: 2px; }
  .traffic { display: flex; align-items: center; gap: 8px; height: 22px; padding-left: 4px; margin-bottom: 14px; }
  .traffic i { width: 12px; height: 12px; border-radius: 50%; }
  .traffic b { margin-left: 14px; font-weight: 600; }
  .search { display: flex; align-items: center; gap: 8px; padding: 6px 8px; color: var(--muted); }
  .search span { flex: 1; }
  .group { font-size: 11px; font-weight: 600; color: var(--muted); padding: 14px 8px 4px; display: flex; align-items: center; gap: 6px; }
  .mono { width: 16px; height: 16px; background: var(--accent); color: var(--on-accent); font-size: 8px; font-weight: 700; display: grid; place-items: center; clip-path: var(--cookie); }
  .row { padding: 7px 10px; border-radius: 12px; display: grid; gap: 1px; }
  .row small { color: var(--muted); font-size: 11px; display: flex; gap: 6px; align-items: center; }
  .row.active { background: var(--tonal); color: var(--on-tonal); }
  .row.active small { color: var(--on-tonal); opacity: .8; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .spacer { flex: 1; }
  .bucket { display: flex; justify-content: space-between; padding: 6px 10px; font-size: 12px; color: var(--muted); }
  .foot { display: flex; gap: 16px; padding: 10px 8px 0; }

  /* Main */
  .main { position: relative; display: flex; flex-direction: column; min-width: 0; }
  .head { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--edge); }
  .head .crumb { color: var(--muted); }
  .head .tools { margin-left: auto; display: flex; gap: 14px; }
  .head .tools .on { background: var(--tonal); border-radius: 8px; padding: 4px; margin: -4px; }
  .head .tools .on svg { stroke: var(--on-tonal); }
  .chat { flex: 1; width: 600px; margin: 0 0 0 96px; padding: 22px 0; display: flex; flex-direction: column; gap: 14px; }
  .bubble { align-self: flex-end; max-width: 420px; background: rgb(from var(--tonal) r g b / .94); color: var(--on-tonal); padding: 9px 14px; border-radius: 20px 20px 6px 20px; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 8px 22px -14px var(--drop); }
  .worked { color: var(--muted); font-size: 12px; }
  .chat p { margin: 0; }
  .chat a { color: var(--accent); font-weight: 600; text-decoration: none; }
  code { font: 12px ui-monospace, "SF Mono", Menlo, monospace; background: rgb(var(--tint) / .55); border: 1px solid var(--edge); padding: 1px 5px; border-radius: 6px; }
  .files { background: rgb(from var(--tonal) r g b / .94); color: var(--on-tonal); border-radius: 16px; padding: 10px 14px; display: grid; gap: 8px; font-size: 12px; }
  .files header { display: flex; gap: 8px; font-weight: 600; }
  .files header span:last-child { margin-left: auto; opacity: .85; }
  .files div { display: flex; gap: 8px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .files div span:first-child { flex: 1; }
  .add { color: var(--add); } .del { color: var(--error); }
  .progress { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  .progress svg { width: 120px; height: 10px; stroke: var(--accent); stroke-width: 3; }
  .progress svg .rest { stroke: rgb(var(--accent-rgb) / .25); }

  /* Composer */
  .composer { width: 600px; margin: 0 0 22px 96px; border-radius: 26px; padding: 14px 14px 10px 18px; display: grid; gap: 14px; --a: calc(.10 + .16); }
  .win.dark .composer { --a: calc(.16 + .16); }
  .composer .ph { color: var(--placeholder); }
  .composer .bar { display: flex; align-items: center; gap: 14px; }
  .attach { width: 32px; height: 32px; border-radius: 50%; background: rgb(from var(--tonal) r g b / .6); display: grid; place-items: center; margin-left: -6px; }
  .attach svg { stroke: var(--on-tonal); }
  .model { margin-left: auto; font-weight: 500; }
  .send { width: 38px; height: 38px; background: var(--accent); clip-path: var(--cookie); display: grid; place-items: center; }
  .send svg { stroke: var(--on-accent); stroke-width: 2.4; }

  /* Popover */
  .pop { position: absolute; right: 16px; top: 54px; width: 230px; border-radius: 18px; padding: 8px; background: var(--panel); border: 1px solid var(--border); box-shadow: 0 18px 40px -16px var(--drop); display: grid; gap: 2px; font-size: 12px; }
  .pop .item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 10px; }
  .pop .item.hl { background: var(--tonal); color: var(--on-tonal); }
  .pop .item.hl svg { stroke: var(--on-tonal); }
  .pop .item .tag { margin-left: auto; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 1px 9px; font-weight: 600; font-size: 11px; }
  .pop hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; width: 100%; }
  .meter { display: grid; grid-template-columns: 1fr 90px 34px; align-items: center; gap: 8px; padding: 3px 8px; color: var(--muted); }
  .meter svg { width: 90px; height: 8px; stroke: var(--accent); stroke-width: 2.5; }
  .meter svg .rest { stroke: rgb(var(--accent-rgb) / .25); }
  .meter b { text-align: right; color: var(--text); font-weight: 500; }

  :root { --cookie: polygon(50.0% 0.0%,54.3% 1.4%,58.0% 4.7%,61.2% 8.3%,64.4% 10.5%,68.2% 10.9%,73.0% 10.2%,78.0% 10.0%,82.1% 11.7%,84.5% 15.5%,85.2% 20.4%,85.4% 25.2%,86.4% 29.0%,89.1% 31.8%,93.2% 34.3%,97.2% 37.4%,99.2% 41.3%,98.6% 45.7%,96.0% 50.0%,93.0% 53.8%,91.4% 57.3%,91.7% 61.2%,93.2% 65.7%,94.3% 70.6%,93.3% 75.0%,90.0% 78.0%,85.2% 79.6%,80.5% 80.5%,77.0% 82.2%,74.8% 85.4%,73.0% 89.8%,70.6% 94.3%,67.1% 97.0%,62.6% 97.2%,58.0% 95.3%,53.8% 93.0%,50.0% 92.0%,46.2% 93.0%,42.0% 95.3%,37.4% 97.2%,32.9% 97.0%,29.4% 94.3%,27.0% 89.8%,25.2% 85.4%,23.0% 82.2%,19.5% 80.5%,14.8% 79.6%,10.0% 78.0%,6.7% 75.0%,5.7% 70.6%,6.8% 65.7%,8.3% 61.2%,8.6% 57.3%,7.0% 53.8%,4.0% 50.0%,1.4% 45.7%,0.8% 41.3%,2.8% 37.4%,6.8% 34.3%,10.9% 31.8%,13.6% 29.0%,14.6% 25.2%,14.8% 20.4%,15.5% 15.5%,17.9% 11.7%,22.0% 10.0%,27.0% 10.2%,31.8% 10.9%,35.6% 10.5%,38.8% 8.3%,42.0% 4.7%,45.7% 1.4%); }
</style>
</head>
<body>

<div class="win" id="light"></div>
<div class="win dark" id="dark"></div>

<script>
  const ui = document.getElementById('ui');
  for (const w of document.querySelectorAll('.win')) w.append(ui.content.cloneNode(true));
  const only = new URLSearchParams(location.search).get('mode') || document.documentElement.dataset.mode;
  if (only) document.querySelectorAll('.win').forEach(w => { if (w.id !== only) w.remove(); });
